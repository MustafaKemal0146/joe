[project]
name = "joe-backend"
version = "0.1.0"
description = "Joe yerel OSINT ve kuramsal analiz calisma alani"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "cryptography>=45,<47",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "redis>=6,<7",
  "pillow>=11,<13",
  "pytesseract>=0.3.13,<1",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
  "charset-normalizer>=3.4,<4",
  "sherlock-project==0.16.0",
  "maigret==0.6.3",
  "alembic>=1.15,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.providers" = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
